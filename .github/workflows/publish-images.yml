name: Publish container images

on:
  # Release Please calls this reusable workflow only after it creates an
  # immutable vX.Y.Z release tag. Ordinary pushes to main do not publish images.
  workflow_call:
    inputs:
      tag:
        description: Immutable release tag created by Release Please (vX.Y.Z).
        required: true
        type: string

  # Manual recovery path for republishing an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to republish
        required: true
        type: string

concurrency:
  group: ghcr-${{ inputs.tag }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve release tag and image namespace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_prefix: ${{ steps.release.outputs.image_prefix }}
      git_sha: ${{ steps.release.outputs.git_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      version: ${{ steps.release.outputs.version }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      publish_aliases: ${{ steps.release.outputs.publish_aliases }}
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got: $TAG" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve image namespace and versions
        id: release
        env:
          TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_aliases=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
            if ! jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false and .published_at != null' <<< "$release" > /dev/null; then
              echo "Expected a published stable GitHub Release for $TAG" >&2
              exit 1
            fi
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            if [[ "$latest" != "$TAG" ]]; then publish_aliases=false; fi
          fi

          sha="$(git rev-parse HEAD)"
          version="${TAG#v}"
          {
            echo "image_prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}"
            echo "git_sha=${sha}"
            echo "short_sha=${sha:0:7}"
            echo "version=${version}"
            echo "major_minor=${version%.*}"
            echo "publish_aliases=${publish_aliases}"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # Fail the matrix if any component fails so we never promote a mixed :latest set.
      fail-fast: true
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend
          - component: sidecar
            dockerfile: Dockerfile.sidecar

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag }},priority=1000
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.git_sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ needs.prepare.outputs.git_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # All-in-one image builds independently so a failure there does not block the 3-service stack.
  build-all-in-one:
    name: Build all-in-one
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}/all-in-one
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag }},priority=1000
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.git_sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ needs.prepare.outputs.git_sha }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

  # Promote the successfully built immutable release tag to :latest.
  promote-latest:
    name: Promote ${{ matrix.component }} aliases
    if: needs.prepare.outputs.publish_aliases == 'true'
    needs: [prepare, build-and-push]
    env:
      IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend, sidecar]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote release aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          TAG: ${{ inputs.tag }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            if [[ "$latest" != "$TAG" ]]; then
              echo "Release $TAG was superseded during the build. Keeping its immutable tags."
              exit 0
            fi
          fi
          image="${IMAGE_PREFIX}/${COMPONENT}"
          docker buildx imagetools create --tag "${image}:latest" --tag "${image}:${MAJOR_MINOR}" "${image}:${TAG}"

  promote-all-in-one-latest:
    name: Promote all-in-one aliases
    if: needs.prepare.outputs.publish_aliases == 'true'
    needs: [prepare, build-all-in-one]
    env:
      IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote release aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            if [[ "$latest" != "$TAG" ]]; then
              echo "Release $TAG was superseded during the build. Keeping its immutable tags."
              exit 0
            fi
          fi
          image="${IMAGE_PREFIX}/all-in-one"
          docker buildx imagetools create --tag "${image}:latest" --tag "${image}:${MAJOR_MINOR}" "${image}:${TAG}"
